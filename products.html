<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Taiwan Sooner Industries Co.</title>
<meta name="description" content="Browse Taiwan Sooner Industries' full range of educational, gaming and consumer headsets, earbuds, speakers and microphones.">
<link rel="icon" href="/images/logo/sooner-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="products">

<div id="site-header"></div>

<section class="section-tight">
  <div class="wrap">
    <div class="section-head">
      <h1>Products</h1>
      <p>Taiwan Sooner Industries Co. provides a wide range of high-quality audio products. If you would like to inquire about products more tailored to your needs, please feel free to contact us for further assistance from our engineers.</p>
      <a class="btn" href="mailto:contact@taiwansooner.com?subject=Inquiry%20from%20(your%20name/company%20name)">Contact us</a>
    </div>
    <div class="grid-4" id="product-grid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/main.js"></script>
<script>
  fetch("/data/products.json").then(r => r.json()).then(products => {
    const grid = document.getElementById("product-grid");
    products
      .filter(p => p.active !== false)
      .forEach(p => {
        const el = document.createElement("div");
        el.className = "product-card";
        const thumb = p.image
          ? `<div class="thumb" style="background-image:url('/${p.image}');background-size:cover;background-position:center"></div>`
          : `<div class="thumb">Photo pending</div>`;
        el.innerHTML = `
          ${thumb}
          <div class="meta">
            <div class="cat">${p.category || ""}</div>
            <h3>${p.name}</h3>
            ${p.description ? `<p style="margin-top:6px">${p.description}</p>` : ""}
          </div>`;
        grid.appendChild(el);
      });
  });
</script>
</body>
</html>
